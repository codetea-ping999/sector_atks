name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Worked example from the research notes
        run: |
          python -m sector_atks vdc \
            --weights examples/fictional_org/weights.csv \
            --validations examples/fictional_org/validations.csv \
            --claimed examples/fictional_org/claimed.csv \
            --as-of 2026-10-26 --previous-as-of 2026-08-31 --json out/report.json
          python -c "import json; v = json.load(open('out/report.json'))['vdc']; assert abs(v - 0.5) < 1e-9, v"
      - name: Shipped weight files are valid
        run: |
          python - <<'PY'
          from pathlib import Path
          from sector_atks import vdc
          files = sorted(Path("data").glob("attack-*/weights/*.csv"))
          assert files, "no weight files"
          for path in files:
              vdc.check_weights(vdc.load_weights(path))
          print(f"{len(files)} weight files OK")
          PY
